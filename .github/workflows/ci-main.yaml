name: ci-main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci-main.yaml
      - Dockerfile
      - requirements.txt

jobs:
  init:
    name: 🧐 Initialize
    runs-on: ubuntu-26.04-arm
    outputs:
      skip_ci: ${{ steps.check_flag.outputs.skip_ci }}
      image_full_version: ${{ steps.check_tag.outputs.image_full_version }}
      image_major: ${{ steps.check_tag.outputs.image_major }}
      image_minor: ${{ steps.check_tag.outputs.image_minor }}
      tag_exists: ${{ steps.check_tag.outputs.tag_exists }}
      is_latest: ${{ steps.check_tag.outputs.is_latest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for --no-ci flag in commit message
        id: check_flag
        run: |
          echo "Checking commit message for --no-ci flag..."
          if echo "${{ github.event.head_commit.message }}" | grep -- '--no-ci'; then
            echo "Skipping CI"
            echo "skip_ci=true" >> $GITHUB_OUTPUT
          else
            echo "skip_ci=false" >> $GITHUB_OUTPUT
          fi

      - name: Check release tag
        id: check_tag
        run: |
          VERSION=$(cat requirements.txt | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+')
          echo "image_full_version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "image_major=v$(echo $VERSION | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "image_minor=v$(echo $VERSION | cut -d. -f1,2)" >> $GITHUB_OUTPUT
      
          export TAG_NAME="v${VERSION}"
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Tag $TAG_NAME does not meet the required format 'vX.Y.Z'."
            exit 1
          fi

          git fetch --unshallow --tags
          export TAG_EXISTS=$(git tag --list $TAG_NAME)
          if [ -n "$TAG_EXISTS" ]; then
            echo "Tag $TAG_NAME already exists."
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

          LATEST_VERSION=$( (git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'; echo "$VERSION") | sort -V | tail -n 1 )
          if [ "$VERSION" = "$LATEST_VERSION" ]; then
            echo "is_latest=true" >> $GITHUB_OUTPUT
          else
            echo "is_latest=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: 🏗️ Build (${{ matrix.arch }})
    needs: init
    if: ${{ needs.init.outputs.skip_ci == 'false' && needs.init.outputs.tag_exists == 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build/Publish image by digest (native ${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Smoke test (native ${{ matrix.arch }})
        run: |
          docker run -i "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
          # Re-running a single failed matrix leg re-uploads the same
          # artifact name into the same run; without this the upload
          # conflicts with the artifact left by the earlier attempt.
          overwrite: true

  finalize:
    name: 🧬 Finalize manifest
    needs: [ init, build ]
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags
        id: docker_tags
        run: |
          {
            echo "tags<<EOF"
            [ "${{ needs.init.outputs.is_latest }}" == "true" ] && \
              echo "ghcr.io/${{ github.repository }}:latest"
            echo "ghcr.io/${{ github.repository }}:${{ needs.init.outputs.image_full_version }}"
            echo "ghcr.io/${{ github.repository }}:${{ needs.init.outputs.image_minor }}"
            echo "ghcr.io/${{ github.repository }}:${{ needs.init.outputs.image_major }}"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create and push versioned manifest
        working-directory: /tmp/digests
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(-t "$tag")
          done <<< "${{ steps.docker_tags.outputs.tags }}"

          source_args=()
          for digest in *; do
            source_args+=("ghcr.io/${{ github.repository }}@sha256:${digest}")
          done

          docker buildx imagetools create \
            "${tag_args[@]}" \
            --annotation index:org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --annotation index:org.opencontainers.image.description="Community-maintained Ansible Docker Image (Python 3.12)" \
            --annotation index:org.opencontainers.image.licenses="MIT" \
            --annotation index:org.opencontainers.image.title="${{ github.repository }}" \
            --annotation index:org.opencontainers.image.url="https://github.com/${{ github.repository }}" \
            --annotation index:org.opencontainers.image.version="${{ needs.init.outputs.image_full_version }}" \
            "${source_args[@]}"

      - name: Verify manifest contains both architectures
        uses: ./.github/actions/verify-multiarch-manifest
        with:
          image: ghcr.io/${{ github.repository }}:${{ needs.init.outputs.image_full_version }}

  release:
    name: 🚀 Release
    needs: [ init, finalize ]
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          tag_prefix: ""
          custom_tag: ${{ needs.init.outputs.image_full_version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Release Body
        id: release_body
        run: |
          BODY_FILE="release_body.md"
          cat <<EOF > $BODY_FILE
          ## Ansible: Community Docker Image

          This release contains Ansible version ${{ needs.init.outputs.image_full_version }}.

          Available image tags for this release:
          - \`${{ needs.init.outputs.image_full_version }}\`
          EOF

          if [ "${{ needs.init.outputs.is_latest }}" = "true" ]; then
            cat <<EOF >> $BODY_FILE
          - \`${{ needs.init.outputs.image_minor }}\`
          - \`${{ needs.init.outputs.image_major }}\`

          > **Tip**: The \`${{ needs.init.outputs.image_minor }}\` and \`${{ needs.init.outputs.image_major }}\` tags will be updated by future releases in the same version line. For reproducible environments, pinning to the full version tag \`${{ needs.init.outputs.image_full_version }}\` is recommended.
          EOF
          else
            cat <<EOF >> $BODY_FILE

          > **Note**: This is a patch release for an older version. The \`${{ needs.init.outputs.image_major }}\` and \`${{ needs.init.outputs.image_minor }}\` tags were not assigned to this image to prevent overriding newer versions.
          EOF
          fi

          cat <<EOF >> $BODY_FILE

          ### Usage

          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}:${{ needs.init.outputs.image_full_version }}
          docker run --rm -it ghcr.io/${{ github.repository }}:${{ needs.init.outputs.image_full_version }} ansible --version
          \`\`\`

          ---
          ⭐ **If you found this project useful, please consider giving it a star on GitHub!**

          ### Changelog

          ${{ steps.tag_version.outputs.changelog }}
          EOF

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.init.outputs.image_full_version }}
          name: "Ansible ${{ needs.init.outputs.image_full_version }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          bodyFile: "release_body.md"

  cleanup:
    name: 🧹 Cleanup
    needs: [ release ]
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Delete merged version branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          merged_branches=$(gh pr list --state merged --base main --limit 10 --json headRefName --jq '.[].headRefName' | grep '^version/' || true)
          for branch in $merged_branches; do
            echo "Checking remote branch: $branch"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Branch $branch still exists remotely. Deleting..."
              git push origin --delete "$branch" || echo "Failed to delete $branch"
            fi
          done
