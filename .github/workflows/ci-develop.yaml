name: ci-develop

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/ci-develop.yaml
      - Dockerfile
      - requirements.txt

jobs:
  init:
    name: 🧐 Inintialize
    runs-on: ubuntu-26.04-arm
    outputs:
      step_init: ${{ steps.check_flag.outputs.step_init }}
      short_sha: ${{ steps.short_sha.outputs.short_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for --no-ci flag in commit message
        id: check_flag
        run: |
          echo "Checking commit message for --no-ci flag..."
          if echo "${{ github.event.head_commit.message }}" | grep -- '--no-ci'; then
            echo "step_init=false" >> $GITHUB_OUTPUT
          else
            echo "step_init=true" >> $GITHUB_OUTPUT
          fi

      - name: Extract short SHA
        id: short_sha
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

  build:
    name: 🏗️ Build (${{ matrix.arch }})
    needs: init
    if: ${{ needs.init.outputs.step_init == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build/Publish image by digest (native ${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository }}-dev,push-by-digest=true,name-canonical=true,push=true

      - name: Smoke test (native ${{ matrix.arch }})
        run: |
          docker run -i "ghcr.io/${{ github.repository }}-dev@${{ steps.build.outputs.digest }}"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
          # Re-running a single failed matrix leg re-uploads the same
          # artifact name into the same run; without this the upload
          # conflicts with the artifact left by the earlier attempt.
          overwrite: true

  finalize:
    name: 🧬 Finalize manifest
    needs: [ init, build ]
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push dev manifest
        working-directory: /tmp/digests
        run: |
          source_args=()
          for digest in *; do
            source_args+=("ghcr.io/${{ github.repository }}-dev@sha256:${digest}")
          done

          docker buildx imagetools create \
            -t "ghcr.io/${{ github.repository }}-dev:latest" \
            -t "ghcr.io/${{ github.repository }}-dev:${{ needs.init.outputs.short_sha }}" \
            --annotation index:org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --annotation index:org.opencontainers.image.description="Community-maintained Ansible Docker Image (Python 3.12) - Development Build" \
            --annotation index:org.opencontainers.image.licenses="MIT" \
            --annotation index:org.opencontainers.image.title="${{ github.repository }}-dev" \
            --annotation index:org.opencontainers.image.url="https://github.com/${{ github.repository }}" \
            "${source_args[@]}"

      - name: Verify manifest contains both architectures
        uses: ./.github/actions/verify-multiarch-manifest
        with:
          image: ghcr.io/${{ github.repository }}-dev:${{ needs.init.outputs.short_sha }}
